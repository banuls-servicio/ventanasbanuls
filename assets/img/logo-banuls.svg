<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sunAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#E2C9A5"/>
    </linearGradient>
  </defs>

  <!-- Architectural Window Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer window frame -->
    <rect x="0" y="0" width="60" height="60" rx="4" fill="none" stroke="url(#frameGrad)" stroke-width="4.5"/>
    <!-- Glass panes -->
    <rect x="6" y="6" width="22" height="22" rx="1.5" fill="url(#glassGrad)"/>
    <rect x="32" y="6" width="22" height="22" rx="1.5" fill="url(#glassGrad)"/>
    <rect x="6" y="32" width="22" height="22" rx="1.5" fill="url(#glassGrad)"/>
    <rect x="32" y="32" width="22" height="22" rx="1.5" fill="url(#glassGrad)"/>
    <!-- Center mullions -->
    <line x1="30" y1="4" x2="30" y2="56" stroke="url(#frameGrad)" stroke-width="3"/>
    <line x1="4" y1="30" x2="56" y2="30" stroke="url(#frameGrad)" stroke-width="3"/>
    <!-- Mediterranean light reflection accent -->
    <line x1="12" y1="12" x2="22" y2="22" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(86, 24)">
    <!-- VENTANAS -->
    <text x="0" y="16" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#64748B">VENTANAS &amp; REFORMAS</text>
    <!-- BAÑULS -->
    <text x="0" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="1.5" fill="#0F172A">BAÑULS</text>
    <!-- Heritage tag -->
    <text x="135" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#C5A880">ALCOY · +60 AÑOS</text>
  </g>
</svg>
