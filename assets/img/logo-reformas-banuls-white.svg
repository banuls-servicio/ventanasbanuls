    <circle cx="43" cy="17" r="4.5" fill="url(#warmOchreWhite)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(86, 24)">
    <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="3.5" fill="#94A3B8">ESTUDIO DE REFORMAS &amp; INTERIORISMO</text>
    <text x="0" y="40" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" letter-spacing="1" fill="#FFFFFF">REFORMAS BAÑULS</text>
    <text x="245" y="40" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#E2C9A5">ALCOY · +60 AÑOS</text>
  </g>
