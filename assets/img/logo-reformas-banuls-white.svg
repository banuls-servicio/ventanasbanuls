<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 80" width="100%" height="100%">
  <defs>
    <linearGradient id="refFrameGradWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="warmOchreWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2C9A5"/>
      <stop offset="100%" stop-color="#C5A880"/>
