    <path d="M4 4 L56 56" stroke="url(#warmOchreWhite)" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="6" y="6" width="22" height="22" rx="2" fill="none" stroke="url(#refFrameGradWhite)" stroke-width="2"/>
