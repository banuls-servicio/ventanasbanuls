<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 80" width="100%" height="100%">
  <defs>
    <linearGradient id="refFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="warmOchre" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A880"/>
      <stop offset="100%" stop-color="#9A7B56"/>
    </linearGradient>
  </defs>

  <!-- Architectural Emblem: Blueprint & Space Transformation -->
  <g transform="translate(10, 10)">
    <!-- Exterior architectural perimeter -->
    <rect x="0" y="0" width="60" height="60" rx="4" fill="none" stroke="url(#refFrameGrad)" stroke-width="4"/>
    <!-- Diagonal architectural compass / golden ratio partition -->
    <path d="M4 4 L56 56" stroke="url(#warmOchre)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Room compartments -->
    <rect x="6" y="6" width="22" height="22" rx="2" fill="#F8FAFC" stroke="url(#refFrameGrad)" stroke-width="2"/>
    <rect x="32" y="32" width="22" height="22" rx="2" fill="#F8FAFC" stroke="url(#refFrameGrad)" stroke-width="2"/>
    <!-- Living corner accent -->
    <circle cx="43" cy="17" r="4.5" fill="url(#warmOchre)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(86, 24)">
    <text x="0" y="16" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="3.5" fill="#64748B">ESTUDIO DE REFORMAS &amp; INTERIORISMO</text>
    <text x="0" y="40" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" letter-spacing="1" fill="#0F172A">REFORMAS BAÑULS</text>
    <text x="245" y="40" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#C5A880">ALCOY · +60 AÑOS</text>
  </g>
</svg>
